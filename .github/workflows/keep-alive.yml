name: Keep Render backend awake

# Render's free plan spins a web service down after ~15 minutes with no
# incoming traffic, and the next real visitor eats a 30-60s cold start.
# This just hits the backend often enough that Render never sees it idle.
#
# The frontend moved to Vercel, which has no equivalent spin-down, so it no
# longer needs a keep-alive ping.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (options-api)
        run: |
          curl -sS --retry 2 --retry-delay 5 -o /dev/null -w "backend: %{http_code}\n" --max-time 300 https://option-explorer-webservice.onrender.com/health
