# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates the database and API service.
#
# The frontend is hosted on Vercel, not Render — Vercel has no cold-start
# spin-down on the free tier, which Render's web services do. Point Vercel's
# project settings at the `frontend/` directory and set NEXT_PUBLIC_API_URL
# there to this service's URL.
#
# CORS_ORIGINS below cannot be derived automatically and is marked
# `sync: false`, so Render prompts you for it at deploy time.

databases:
  - name: options-db
    databaseName: options_tool
    user: options
    plan: free # Free Postgres expires after 90 days; upgrade to `basic-256mb` to keep it.

services:
  # ── Backend: FastAPI ────────────────────────────────────────────────
  - type: web
    name: options-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every deploy; alembic is idempotent so this is safe.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: options-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Market prices, history, and option chains are retrieved with yfinance.
      # Must list the frontend's deployed URL(s), e.g. https://www.option-ideas.com
      # The native app origins (capacitor://localhost) are added in code, not here.
      - key: CORS_ORIGINS
        sync: false
