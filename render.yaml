# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates all three services in one go.
#
# Two values cannot be derived automatically and are marked `sync: false`,
# so Render prompts you for them at deploy time. Both are chicken-and-egg:
# each service needs the other's URL, which does not exist until it is created.
# Deploy once, copy the two .onrender.com URLs, then fill them in and redeploy.

databases:
  - name: options-db
    databaseName: options_tool
    user: options
    plan: free # Free Postgres expires after 90 days; upgrade to `basic-256mb` to keep it.

services:
  # ── Backend: FastAPI ────────────────────────────────────────────────
  - type: web
    name: options-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every deploy; alembic is idempotent so this is safe.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: options-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Must list the frontend's URL, e.g. https://options-web.onrender.com
      # The native app origins (capacitor://localhost) are added in code, not here.
      - key: CORS_ORIGINS
        sync: false

  # ── Frontend: Next.js ───────────────────────────────────────────────
  - type: web
    name: options-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # NEXT_PUBLIC_* is inlined at BUILD time, not read at runtime. Changing
      # this requires a rebuild, not just a restart — and it is the same value
      # the iOS/Android builds need. e.g. https://options-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Auth stays off: the ideas flow is public and needs no sign-in.
      # To enable it, set this to "true" and add NEXTAUTH_URL, NEXTAUTH_SECRET,
      # and your Google/GitHub OAuth credentials.
      - key: NEXT_PUBLIC_ENABLE_AUTH
        value: "false"
